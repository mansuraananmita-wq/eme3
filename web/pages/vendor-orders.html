<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("eme-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script>
      (function () {
        var path = location.pathname.replace(/\\/g, "/");
        if (/\/web$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <title>Shop orders — EME</title>
    <link rel="icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/account.css">
  </head>
  <body data-page="vendor-orders">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main">
      <div class="wrap">
        <header class="vendor-orders-head">
          <div>
            <h1>Shop orders / অর্ডার</h1>
            <p class="muted">Update your line items: pending → processing → shipped → delivered (or cancel). Cash on delivery is marked paid when the whole order is delivered.</p>
          </div>
          <div class="vendor-orders-links">
            <a class="button button-ghost" href="vendor-reels.html">Your reels</a>
          </div>
        </header>
        <form id="vendor-order-filters" class="filter-bar">
          <label class="field">
            <span class="sr-only">Status</span>
            <select name="status">
              <option value="">All statuses</option>
              <option value="pending">Pending</option>
              <option value="processing">Processing</option>
              <option value="shipped">Shipped</option>
              <option value="delivered">Delivered</option>
              <option value="cancelled">Cancelled</option>
            </select>
          </label>
          <button class="button button-ghost" type="submit">Filter</button>
        </form>
        <div id="vendor-orders-root" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <script type="module" src="../js/vendor-orders-page.js"></script>
  </body>
</html>
