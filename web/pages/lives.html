<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("eme-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script>
      (function () {
        var path = location.pathname.replace(/\\/g, "/");
        if (/\/web$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <title>Live — EME</title>
    <link rel="icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css?v=9">
    <link rel="stylesheet" href="../css/base.css?v=12">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/live.css?v=9">
  </head>
  <body class="lives-page" data-page="lives">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main" class="page-wrap">
      <h1 class="page-title" data-i18n="liveShopping">Live shopping</h1>

      <section class="lives-section" aria-labelledby="lives-now-heading">
        <h2 id="lives-now-heading">Live now</h2>
        <div class="lives-grid" id="lives-now" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </section>

      <section class="lives-section" aria-labelledby="lives-upcoming-heading">
        <h2 id="lives-upcoming-heading">Upcoming</h2>
        <div class="lives-grid" id="lives-upcoming" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <script type="module" src="../js/lives-page.js"></script>
  </body>
</html>
