<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9233"/>
      <stop offset="100%" stop-color="#E66A00"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB366"/>
      <stop offset="100%" stop-color="#FF7A00"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#B24700" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="90" fill="#FFFFFF"/>

  <g transform="translate(0, -10)">
    <!-- Brand Icon: Stylized Multi-vendor Marketplace Shopping Bag + Interlinked Infinity / 'm' & 'e' Flow -->
    <g transform="translate(150, 85)" filter="url(#subtleShadow)">
      <!-- Bag Handles -->
      <path d="M 65 80 C 65 35, 135 35, 135 80" fill="none" stroke="url(#primaryGrad)" stroke-width="14" stroke-linecap="round"/>
      
      <!-- Shopping Bag Main Body -->
      <path d="M 30 75 L 170 75 C 182 75, 190 86, 187 98 L 168 200 C 166 210, 157 218, 147 218 L 53 218 C 43 218, 34 210, 32 200 L 13 98 C 10 86, 18 75, 30 75 Z" fill="url(#primaryGrad)"/>

      <!-- Marketplace Interconnection Motif / Cart & Fold Foldout -->
      <!-- Modern layered fold creating 'm' arches for multi-vendor inside the bag -->
      <path d="M 46 110 Q 75 160 100 115 Q 125 160 154 110" fill="none" stroke="#FFFFFF" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.95"/>

      <!-- Central Marketplace Hub / Star Sparkle -->
      <circle cx="100" cy="165" r="9" fill="#FFFFFF"/>
      <circle cx="65" cy="160" r="5" fill="#FFE2C7"/>
      <circle cx="135" cy="160" r="5" fill="#FFE2C7"/>
      <line x1="65" y1="160" x2="100" y2="165" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3" opacity="0.8"/>
      <line x1="135" y1="160" x2="100" y2="165" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-dasharray="3,3" opacity="0.8"/>
    </g>

    <!-- Typography: "eme" lowercase modern wordmark -->
    <g transform="translate(250, 370)">
      <!-- Main wordmark text -->
      <text x="0" y="0" font-family="system-ui, -apple-system, 'Inter', 'Montserrat', sans-serif" font-size="78" font-weight="900" letter-spacing="-1.5px" fill="#1C1E21" text-anchor="middle">
        e<tspan fill="#E66A00">m</tspan>e
      </text>
      <!-- Sub-label indicating multi-vendor marketplace -->
      <text x="0" y="32" font-family="system-ui, -apple-system, 'Inter', 'Segoe UI', sans-serif" font-size="14" font-weight="700" letter-spacing="4px" fill="#8A92A0" text-anchor="middle">
        MARKETPLACE
      </text>
      <!-- Small orange dot accent -->
      <circle cx="94" cy="-52" r="6" fill="#E66A00"/>
    </g>
  </g>
</svg>