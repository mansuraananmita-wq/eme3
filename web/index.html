<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>EME — Shop</title>
    <meta name="description" content="Multi-vendor shop with products from approved stores.">
    <link rel="icon" href="assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/tokens.css">
    <link rel="stylesheet" href="css/base.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main">
      <div class="wrap">
        <section class="hero">
          <h1>Shop from trusted stores</h1>
          <p>বিশ্বস্ত দোকান থেকে কেনাকাটা। Active products from approved shops, priced in BDT.</p>
          <a class="button button-primary" href="#products">Browse products</a>
        </section>

        <section class="section" aria-labelledby="category-heading">
          <div class="section-head">
            <h2 id="category-heading">Categories</h2>
            <p>Active departments</p>
          </div>
          <div class="category-row" id="category-row" aria-busy="true">
            <div class="skeleton skeleton-chip"></div>
            <div class="skeleton skeleton-chip"></div>
            <div class="skeleton skeleton-chip"></div>
            <div class="skeleton skeleton-chip"></div>
          </div>
        </section>

        <section class="section" id="products" aria-labelledby="product-heading">
          <div class="section-head">
            <h2 id="product-heading">New products</h2>
            <p>Approved shops only</p>
          </div>
          <div class="product-grid" id="product-grid" aria-busy="true">
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
            <div class="skeleton skeleton-card"></div>
          </div>
        </section>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <noscript><p class="empty wrap">EME needs JavaScript to load the shop.</p></noscript>
    <script type="module" src="js/home.js"></script>
  </body>
</html>
