  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <script>
    (function () {
      var key = "eme-theme";
      var theme = "light";
      try {
        var stored = localStorage.getItem(key);
        if (stored === "light" || stored === "dark") theme = stored;
        else if (window.matchMedia("(prefers-color-scheme: dark)").matches) theme = "dark";
      } catch (err) {}
      var root = document.documentElement;
      root.setAttribute("data-theme", theme);
      root.style.colorScheme = theme;
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute("content", theme === "dark" ? "#0B0B12" : "#F8F9FC");
    })();
  </script>
  <link rel="stylesheet" href="../assets/css/tokens.css" />
  <link rel="stylesheet" href="../assets/css/base.css" />
