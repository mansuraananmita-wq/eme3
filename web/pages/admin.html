<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("eme-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script>
      (function () {
        var path = location.pathname.replace(/\\/g, "/");
        if (/\/web$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <title>Admin — EME</title>
    <link rel="icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css">
    <link rel="stylesheet" href="../css/base.css?v=8">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/account.css">
  </head>
  <body data-page="admin">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main">
      <div class="wrap admin-wrap">
        <h1 data-i18n="admin">Admin</h1>
        <p class="muted" data-i18n="dashLead">Dashboard first, then vendors, catalog, and orders.</p>
        <div class="admin-tabs" id="admin-tabs" role="tablist">
          <button type="button" data-tab="dashboard" class="is-active" role="tab" aria-selected="true" data-i18n="dashboard">Dashboard</button>
          <button type="button" data-tab="vendors" role="tab" aria-selected="false" data-i18n="vendors">Vendors</button>
          <button type="button" data-tab="moderation" role="tab" aria-selected="false" data-i18n="moderation">Moderation</button>
          <button type="button" data-tab="orders" role="tab" aria-selected="false" data-i18n="orders">Orders</button>
          <button type="button" data-tab="disputes" role="tab" aria-selected="false" data-i18n="disputes">Disputes</button>
          <button type="button" data-tab="payouts" role="tab" aria-selected="false" data-i18n="payouts">Payouts</button>
          <button type="button" data-tab="people" role="tab" aria-selected="false" data-i18n="people">People</button>
          <button type="button" data-tab="categories" role="tab" aria-selected="false" data-i18n="catalog">Catalog</button>
          <button type="button" data-tab="settings" role="tab" aria-selected="false" data-i18n="settings">Settings</button>
        </div>
        <div id="admin-root" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <script type="module" src="../js/admin-page.js?v=8"></script>
  </body>
</html>
