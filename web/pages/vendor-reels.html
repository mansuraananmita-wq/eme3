<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("eme-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script>
      (function () {
        var path = location.pathname.replace(/\\/g, "/");
        if (/\/web$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <title>Manage reels — EME</title>
    <link rel="icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css?v=9">
    <link rel="stylesheet" href="../css/base.css?v=9">
    <link rel="stylesheet" href="../css/marketplace.css">
    <link rel="stylesheet" href="../css/reels.css">
  </head>
  <body data-page="vendor-reels">
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main">
      <div class="wrap vendor-reels-wrap">
        <header class="vendor-reels-head">
          <div>
            <h1 data-i18n="yourReels">Your reels</h1>
            <p class="muted">Upload short videos, tag your products, and publish to the feed.</p>
          </div>
          <a class="button button-ghost" href="vendor-orders.html">Shop orders</a>
          <a class="button button-ghost" href="reels.html">Watch feed</a>
        </header>
        <div id="vendor-reels-root" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
        </div>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <script type="module" src="../js/vendor-reels-page.js"></script>
  </body>
</html>
