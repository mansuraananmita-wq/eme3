<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("eme-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script>
      (function () {
        var path = location.pathname.replace(/\\/g, "/");
        if (/\/web$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <title>Create account — EME</title>
    <link rel="icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css?v=9">
    <link rel="stylesheet" href="../css/base.css?v=12">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main">
      <form class="auth-card" id="register-form" novalidate>
        <h1 data-i18n="createAccount">Create account</h1>
        <p class="muted">Pick who this login is. Customer shops. Vendor opens a studio and can go live. Admin opens the admin desk.</p>
        <fieldset class="role-pick">
          <legend>I am joining as</legend>
          <label>
            <input type="radio" name="signup_role" value="customer" checked>
            <span>Customer</span>
            <small>Buy, follow shops, and watch live.</small>
          </label>
          <label>
            <input type="radio" name="signup_role" value="vendor">
            <span>Vendor</span>
            <small>Open a shop, add products, and go live.</small>
          </label>
          <label>
            <input type="radio" name="signup_role" value="admin">
            <span>Admin</span>
            <small>Approve shops, orders, and payouts.</small>
          </label>
        </fieldset>
        <label class="field" id="shop-name-field" hidden>
          <span>Shop name</span>
          <input name="shop_name" type="text" maxlength="80" autocomplete="organization">
          <small class="field-error" id="shop-error"></small>
        </label>
        <label class="field">
          <span>Full name</span>
          <input name="full_name" type="text" autocomplete="name" maxlength="120" required>
          <small class="field-error" id="name-error"></small>
        </label>
        <label class="field">
          <span>Email</span>
          <input name="email" type="email" autocomplete="email" required>
          <small class="field-error" id="email-error"></small>
        </label>
        <label class="field">
          <span>Password</span>
          <input name="password" type="password" autocomplete="new-password" required>
          <small class="field-error" id="password-error"></small>
        </label>
        <button class="button button-primary" type="submit">Create account</button>
        <p class="muted">Already registered? <a id="login-link" href="login.html">Sign in</a></p>
      </form>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <script type="module" src="../js/register.js?v=3"></script>
  </body>
</html>
