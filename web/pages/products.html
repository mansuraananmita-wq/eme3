<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <script>
      (function () {
        var theme = "light";
        try {
          var stored = localStorage.getItem("eme-theme");
          if (stored === "dark" || stored === "light") theme = stored;
        } catch (e) {}
        document.documentElement.setAttribute("data-theme", theme);
        document.documentElement.style.colorScheme = theme;
      })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    
    <script>
      (function () {
        var path = location.pathname.replace(/\\/g, "/");
        if (/\/web$/i.test(path)) {
          location.replace(path + "/" + location.search + location.hash);
        }
      })();
    </script>
    <title>Products — EME</title>
    <link rel="icon" href="../assets/favicon.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/tokens.css?v=9">
    <link rel="stylesheet" href="../css/base.css?v=9">
    <link rel="stylesheet" href="../css/catalog.css">
    <link rel="stylesheet" href="../css/marketplace.css">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" id="site-header"></header>
    <main id="main">
      <div class="wrap">
        <h1 data-i18n="products">Products</h1>
        <nav class="result-tabs" id="result-tabs" aria-label="Search results" hidden></nav>
        <form class="filters" id="filters">
          <label>Category
            <select name="category"><option value="">All categories</option></select>
          </label>
          <label>Store
            <select name="shop"><option value="">All stores</option></select>
          </label>
          <label>Min price
            <input name="min" inputmode="decimal" placeholder="0">
          </label>
          <label>Max price
            <input name="max" inputmode="decimal" placeholder="Any">
          </label>
          <label>Sort
            <select name="sort">
              <option value="newest">Newest</option>
              <option value="price-asc">Price: low to high</option>
              <option value="price-desc">Price: high to low</option>
              <option value="trending">Trending</option>
            </select>
          </label>
          <input name="q" type="hidden">
          <button class="button button-primary" type="submit">Apply</button>
        </form>
        <p class="muted" id="result-summary"></p>
        <div class="product-grid" id="product-grid" aria-busy="true">
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
          <div class="skeleton skeleton-card"></div>
        </div>
        <div id="shop-results" hidden></div>
        <div class="load-more" id="load-more"></div>
      </div>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <nav class="bottom-nav" id="bottom-nav" aria-label="Mobile"></nav>
    <div class="toast-root" id="toast-root"></div>
    <div class="modal-root" id="modal-root"></div>
    <script type="module" src="../js/products.js"></script>
  </body>
</html>
